name: Azure Static Web Apps

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pull-requests: write

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: Quality Gate
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  build_and_deploy:
    needs: quality
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build adapter and example
        run: bun run build && bun run test:example

      - name: Verify deploy artifacts
        run: |
          test -f examples/basic/dist/client/index.html
          test -f examples/basic/dist/client/staticwebapp.config.json
          test -f examples/basic/dist/client/admin/index.html
          test -f examples/basic/dist/client/admin/config.yml
          grep -Fq '"/admin/*"' examples/basic/dist/client/staticwebapp.config.json
          test -f examples/basic/dist/api/host.json
          test -f examples/basic/dist/api/package.json
          test -f examples/basic/dist/api/server/index.mjs
          grep -q '"react"' examples/basic/dist/api/package.json
          find examples/basic/dist/client -maxdepth 2 -type f | sort
          find examples/basic/dist/api -maxdepth 3 -type f | sort

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: examples/basic/dist/client
          api_location: examples/basic/dist/api
          output_location: ""
          skip_app_build: true

      - name: Resolve preview URL
        id: resolve_preview
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                per_page: 100,
              },
            );

            deployments.sort((left, right) => {
              return Date.parse(right.created_at) - Date.parse(left.created_at);
            });

            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                },
              );
              const status = statuses.find(
                ({ state, environment_url }) =>
                  state === "success" && Boolean(environment_url),
              );

              if (status?.environment_url) {
                const url = status.environment_url.replace(/\/+$/, "");
                core.info("Using preview deployment " + deployment.id + " at " + url);
                core.setOutput("url", url);
                return;
              }
            }

            core.setFailed(
              "No successful preview deployment URL found for " + context.sha,
            );

      - name: Select smoke target
        id: smoke_target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_URL: ${{ steps.resolve_preview.outputs.url }}
          PRODUCTION_URL: https://blue-wave-00d0bf30f.7.azurestaticapps.net
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            case "$PREVIEW_URL" in
              https://*) ;;
              *)
                echo "No HTTPS preview URL was resolved for $GITHUB_SHA"
                exit 1
                ;;
            esac
            printf 'base_url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          else
            printf 'base_url=%s\n' "$PRODUCTION_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test deployment
        env:
          SMOKE_BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: |
          test -n "$SMOKE_BASE_URL"
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /tmp/swa-health.json -w "%{http_code}" "$SMOKE_BASE_URL/api/health" || true)"
            if [ "$status" = "200" ]; then
              echo "Smoke target: $SMOKE_BASE_URL"
              cat /tmp/swa-health.json
              exit 0
            fi
            echo "Attempt $attempt: $SMOKE_BASE_URL/api/health returned $status"
            sleep 10
          done
          echo "Deployment /api/health did not return 200 at $SMOKE_BASE_URL"
          cat /tmp/swa-health.json || true
          exit 1

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: examples/basic/dist/client
